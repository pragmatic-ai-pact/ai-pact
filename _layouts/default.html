<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e7">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/pact-overrides.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="The Pragmatic AI Engineer Pact home">
          The Pragmatic <span>AI</span> Engineer Pact
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="#pact">The Pact</a>
          <a href="#principles">Principles</a>
          <a href="#commitment">Commitment</a>
          <a href="#adopters">Adopters</a>
          <a href="#appendix">Appendix</a>
        </nav>
      </header>
      {{ content }}
      <footer class="site-footer">
        <div class="footer-meta">
          <span>The Pragmatic AI Engineer Pact</span>
          <span aria-hidden="true">·</span>
          <span>{{ site.time | date: "%Y" }}</span>
        </div>
        <div class="footer-links">
          <a href="https://github.com/pragmatic-ai-pact/ai-pact/blob/main/PACT.md">Read the source</a>
          <a href="https://github.com/pragmatic-ai-pact/ai-pact/discussions">Join the discussion</a>
        </div>
        <span class="footer-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </footer>
    </div>
    <script src="{{ '/assets/js/pact.js' | relative_url }}" defer></script>
  </body>
</html>
